<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 533 300" width="100%" height="100%">
  <rect width="533" height="300" fill="#15171C"/>
  <!-- Magazine Spine Division -->
  <line x1="266.5" y1="0" x2="266.5" y2="300" stroke="#2D323E" stroke-width="2"/>
  <!-- Left Page: Typography Focus -->
  <rect x="30" y="30" width="206" height="240" fill="#1F232D" rx="4"/>
  <text x="50" y="80" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#64B5F6">FORM &amp;</text>
  <text x="50" y="112" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#FFFFFF">FUNCTION</text>
