  <path d="M80 80 C180 30 320 90 310 220 C300 350 180 430 90 370 C0 310 -20 130 80 80 Z" fill="#D3E2D5"/>
  <!-- Bottle Shadow -->
  <ellipse cx="180" cy="380" rx="45" ry="12" fill="#ADC2B1" opacity="0.5"/>
  <!-- Bottle Body -->
  <rect x="145" y="190" width="70" height="180" rx="35" fill="#FFFFFF" opacity="0.95"/>
  <rect x="165" y="150" width="30" height="40" rx="4" fill="#E2CDBA"/>
  <rect x="172" y="130" width="16" height="20" rx="2" fill="#D4B69C"/>
