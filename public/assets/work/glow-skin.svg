  <rect x="150" y="240" width="60" height="80" rx="4" fill="#F8F6F0"/>
  <text x="180" y="270" font-family="Georgia, serif" font-size="10" font-weight="700" fill="#2E4033" text-anchor="middle" letter-spacing="2">GLOW</text>
  <text x="180" y="285" font-family="sans-serif" font-size="6" font-weight="600" fill="#78927E" text-anchor="middle" letter-spacing="1">BOTANICAL</text>
  <line x1="165" y1="295" x2="195" y2="295" stroke="#D3E2D5" stroke-width="1"/>
  <text x="180" y="306" font-family="monospace" font-size="5" fill="#888888" text-anchor="middle">50ML / 1.7 FL OZ</text>
  <!-- Card Title overlay text at top -->
  <text x="30" y="55" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#2E4033" letter-spacing="1">GLOW BOTANICAL</text>
  <text x="30" y="73" font-family="sans-serif" font-size="9" fill="#58745E" letter-spacing="2">SUSTAINABLE SKINCARE</text>
</svg>
